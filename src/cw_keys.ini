F2 = {RST} {EXCH}
F3 = {EXCH}
F4 = {MYCALL}
F5 =  AGN
F6 =  NR
F7 = {RST}
F8 = QRZ
F9 = {HISCALL}
F10 = ?

[S&P]
F1 = CQ DE {MYCALL}
F2 = {RST} {EXCH}
F3 = {EXCH}
F4 = {MYCALL}
F5 =  AGN
F6 =  NR
F7 = {RST}
F8 = QRZ
F9 = {HISCALL}
F10 = ?
[QTC]
; PREAMBLE is sent once before the QTC bundle (announces bundle number / count)
PREAMBLE = QTC {QTC_NR}/{QTC_COUNT}
; RECORD is sent for each individual QSO in the bundle
RECORD = {QTC_TIME} {QTC_CALL} {QTC_EXCH}
; CONFIRM is sent after the receiver acknowledges a bundle or record
CONFIRM = QSL
; REQUEST is sent by a DX station asking an EU station for QTC
REQUEST = QRV
