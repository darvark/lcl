# SP Activity Contest (SPAC)
# DXLog-style normalized local definition.
#
# Practical support implemented here:
# - Exchange sent: serial + own locator
# - Exchange recv: serial + locator in one field
# - Points: distance in km on VHF/UHF/SHF bands
# - Multipliers: worked locators per band

NAME=SPAC
CABRILLO_NAME=SPAC
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=SERIAL_GRID
MULTIPLIER=GRID_PER_BAND
BONUS_POINTS=0
FIELD=SERIAL_GRID,Serial + Locator,required