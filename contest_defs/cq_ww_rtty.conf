STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=CQZONE
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PLUS_ZONE_PER_BAND
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=ZONE,CQ Zone,required
