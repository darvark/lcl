# Holyland DX Contest
# Source: https://dxlog.net/sw/files/download/contest/HOLYLAND.txt
# Cabrillo: HOLYLAND-DX
#
# Scoring:
#   4X working 4X (same DXCC) : 1 pt
#   4X working Asian stations  : 2 pts
#   4X working all others      : 8 pts
#   DX working 4X             : 8 pts
#   /MM stations              : 4 pts
#   Same continent            : 2 pts (non-4X)
#   Different continent       : 4 pts (non-4X)
# Exchange:
#   4X: AREA code (e.g. F17AS)
#   Others: serial number
# Multipliers:
#   4X areas per band (CUSTOM, not implemented)
#   DXCC per band
#   Note: area multiplier approximated as DXCC_PER_BAND

NAME=HOLYLAND-DX
CABRILLO_NAME=HOLYLAND-DX
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=HIGH
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PER_BAND
FIELD=SERIAL,Rcv Exch,required
