# CQ World Wide VHF Contest
# Source: https://dxlog.net/sw/files/download/contest/CQWWVHF.txt
#
# Extended adaptation note:
# - DXLog uses grid-square multiplier with custom FX (first 4 chars) and
#   distance-aware (QRB) scoring + band bonus.
# - This logger supports grid per band multiplier and baseline points.
# - FM mode handling and QRB-based points are simplified.

NAME=CQ-WW-VHF
CABRILLO_NAME=CQ-VHF-SSBCW
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=GRID
POINTS_PER_QSO=1
MULTIPLIER=GRID_PER_BAND
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=GRID,Rcv Grid,required
