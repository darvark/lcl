# LZ DX Contest
# Source: https://dxlog.net/sw/files/download/contest/LZDX.txt
#
# Extended adaptation note:
# - DXLog definition combines ITU zone, LZ district, and DXCC multipliers with
#   station-dependent exceptions (MULT1/MULT2/MULT3).
# - This logger supports one multiplier family, so we keep ITU zone per band
#   as the closest global approximation.
# - Scoring exceptions by station type are flattened to baseline POINTS_PER_QSO.

NAME=LZ-DX
CABRILLO_NAME=LZ-DX
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=ITU
POINTS_PER_QSO=1
MULTIPLIER=ZONE_PER_BAND
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=EXCHANGE,Rcv Zone/District,required
