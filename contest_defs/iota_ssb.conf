# RSGB IOTA Contest - SSB
# Source: https://dxlog.net/sw/files/download/contest/IOTA.txt
#
# Extended adaptation note:
# - DXLog uses IOTA reference multiplier from RECINFO with FX logic and
#   complex conditional scoring depending on island/non-island exchange.
# - This profile keeps serial exchange and uses one supported multiplier family
#   as approximation (DXCC per band).
# - Exact IOTA-entity multiplier math is simplified.

NAME=RSGB-IOTA-SSB
CABRILLO_NAME=RSGB-IOTA
MODE=SSB
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PER_BAND
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=SERIAL_IOTA,Rcv Nr/IOTA,required
