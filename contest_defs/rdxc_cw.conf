# Russian DX Contest - CW
# Source: https://dxlog.net/sw/files/download/contest/RDXC.txt
# Cabrillo: RDXC
#
# Scoring (simplified - full scoring requires oblast detection):
#   Working Russia (UA/RI1AN) : 10 pts
#   Same DXCC                 : 2 pts
#   Same continent            : 3 pts
#   Different continent       : 5 pts
#   Russian stations:
#     same oblast             : 2 pts
#     same continent          : 3 pts
#     diff continent          : 5 pts
# Exchange:
#   Russian stations: oblast abbreviation (e.g. SP, MO)
#   Other stations  : serial number
# Multipliers:
#   MULT1: Russian oblasts per band (CUSTOM, not implemented -> DXCC_PER_BAND)
#   MULT2: DXCC per band
#
# Note: Full RDXC scoring (oblast multiplier, Russian station bonus) is not
#       yet implemented. DXCC_PER_BAND + simplified scoring is used.

NAME=RDXC-CW
CABRILLO_NAME=RDXC
MODE=CW
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=HIGH
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PER_BAND
FIELD=SERIAL,Rcv Exch,required
