# IARU HF World Championship
# Source: https://dxlog.net/sw/files/download/contest/IARUHF.txt
# Cabrillo: IARU-HF
#
# Scoring:
#   Same zone/country   : 1 pt
#   Same continent      : 3 pts
#   Different continent : 5 pts
#   HQ station          : treated as 1 pt (HQ detection not implemented)
# Exchange sent: ITU zone number or HQ abbreviation
# Exchange recv: ITU zone number or HQ abbreviation
# Multipliers: ITU zones per band (ZONE_PER_BAND) + HQ stations per band
#   Note: HQ station multiplier not implemented; ITU zone used as approximation

NAME=IARU-HF-CHAMPIONSHIP
CABRILLO_NAME=IARU-HF
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
EXCHANGE_SENT=ITU
POINTS_PER_QSO=1
MULTIPLIER=ZONE_PER_BAND
FIELD=ITU_ZONE,ITU Zone or HQ,required
