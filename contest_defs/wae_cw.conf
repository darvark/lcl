# WAE DX Contest - CW
# Worked All Europe DX Contest (CW)
# Sponsor: Deutscher Amateur Radio Club (DARC)
# Rules:   https://www.darc.de/der-club/referate/conteste/wae-dx-contest/en/
# Source:  https://dxlog.net/sw/files/download/contest/WAE.txt
#
# Scoring:
#   EU working DX  = 1 pt/QSO
#   DX working EU  = 1 pt/QSO
#   EU-EU / DX-DX  = 0 pts (same-continent dupes)
#
# Multipliers:
#   MULT1 – DXCC per band (primary)
#   MULT2 – Prefix area per band for K, VE, VK, ZL, ZS, JA, BY, PY, UA9
#           (not yet implemented; DXCC_PER_BAND is used as best approximation)
#
# QTC: EU stations transmit batches of up to 10 worked QSOs to DX stations.
#      Each QTC record = 1 additional point.
#
# Bands: 80, 40, 20, 15, 10 m

NAME=WAE-DX-CW
CABRILLO_NAME=DARC-WAEDC-CW
MODE=CW
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=HIGH

# Sent exchange: serial number (auto-incremented)
EXCHANGE_SENT=#

# QSO base points (WAE logic: EU<->DX=1, same-continent=0)
POINTS_PER_QSO=1

# Primary multiplier: DXCC per band
# Note: full WAE scoring also uses prefix-area multipliers for the nine
# large DX entities (K, VE, VK, ZL, ZS, JA, BY, PY, UA9); these are
# approximated here by the standard DXCC-per-band count.
MULTIPLIER=DXCC_PER_BAND

# QTC traffic exchange
QTC_SENDER=EU
POINTS_PER_QTC=1

# Exchange field: received serial number
FIELD=SERIAL,Rcv Nr,required
