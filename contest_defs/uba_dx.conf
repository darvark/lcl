# UBA DX Contest
# Source: https://dxlog.net/sw/files/download/contest/UBA.txt
#
# Extended adaptation note:
# - DXLog uses three multiplier families with conditions:
#   1) UBA sections (CUSTOM)
#   2) ON prefixes (WPX)
#   3) DXCC (with EU filtering and ON exceptions)
# - Current logger keeps a single multiplier family; we use DXCC_PER_BAND as
#   practical approximation for mixed ON/non-ON operation.
# - Complex country-dependent points are simplified to baseline POINTS_PER_QSO.

NAME=UBA-DX
CABRILLO_NAME=UBA-DX-MIXED
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PER_BAND
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=EXCHANGE,Rcv Nr/Section,required
