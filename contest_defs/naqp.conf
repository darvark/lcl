# North American QSO Party (NAQP)
# Source: https://dxlog.net/sw/files/download/contest/NAQP.txt
#
# Extended adaptation note:
# - DXLog uses two multiplier families:
#   1) State/Province (CUSTOM, PER_BAND)
#   2) DXCC (PER_BAND, NA-only conditions)
# - It also uses name + location exchange and special NA-only validity rules.
# - This logger keeps a single multiplier family (DXCC) and one exchange field.
# - Detailed conditional points and multi-operator timing rules are not modeled.

NAME=NAQP
CABRILLO_NAME=NAQP-MIXED
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=EXCHANGE,Rcv Name/Loc,required
