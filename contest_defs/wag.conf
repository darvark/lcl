# Worked All Germany Contest
# Source: https://dxlog.net/sw/files/download/contest/WAG.txt
# Cabrillo: WAG
# Mode: CW + SSB (mixed weekend)
#
# Scoring:
#   DL working DL (same DXCC)  : 1 pt
#   DL working EU              : 3 pts
#   DL working non-EU          : 5 pts
#   non-DL working DL          : 3 pts
#   non-DL working non-DL      : 0 pts (not valid)
# Exchange:
#   DL DARC members: DOK district letter (A-Z)
#   DL non-members : NM
#   All others     : serial number
# Multipliers:
#   For DL: DXCC entities per band+mode
#   For non-DL: German DOK districts per band+mode (not fully implemented)
#   Note: DOK multiplier approximated as DXCC_PER_BAND

NAME=WAG
CABRILLO_NAME=WAG
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=HIGH
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PER_BAND
FIELD=SERIAL,Rcv Exch,required
