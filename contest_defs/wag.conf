# Worked All Germany Contest
# Source: https://dxlog.net/sw/files/download/contest/WAG.txt
# Cabrillo: WAG
# Mode: CW + SSB (mixed weekend)
#
# Scoring:
#   DL working DL (same DXCC)  : 1 pt
#   DL working EU              : 3 pts
#   DL working non-EU          : 5 pts
#   non-DL working DL          : 3 pts
#   non-DL working non-DL      : 0 pts (not valid)
# Exchange:
#   DL stations: set STATION_EXCHANGE in logger.conf to the station DOK or NM
#   All others : serial number (generated automatically)
# Multipliers:
#   Multipliers are band+mode dependent: DXCC/WAE entities for DL stations,
#   German DOK district letters (first character) for non-DL stations.

NAME=WAG
CABRILLO_NAME=WAG
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=HIGH
VALIDATE_OPERATING_RULES=1
ALLOWED_MODES=CW,SSB
ALLOWED_BANDS=80M,40M,20M,15M,10M
MAX_POWER_WATTS=1500
EXCLUDED_SEGMENT=CW,3560,3800
EXCLUDED_SEGMENT=CW,7040,7200
EXCLUDED_SEGMENT=CW,14060,14350
EXCLUDED_SEGMENT=SSB,3650,3700
