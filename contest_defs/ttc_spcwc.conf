# Tuesday's Telegraphy Contest (TTC-SPCWC)
# Source: https://spcwc.pl/ttc/rules/pl
# Cabrillo: TTC-SPCWC
#
# Rules summary (official):
#   - Time: every Tuesday, 19:30-20:29:59 UTC (4 x 15 min stages)
#   - Bands: 80 m (3520-3555 kHz), 40 m (7010-7040 kHz)
#   - Mode: CW only
#   - Exchange: RST + serial number starting from 001
#   - QSO points: 1 point per valid QSO
#   - Final score: QSO * U, where U = unique worked calls in the whole round
#
# Implementation notes for Logger:
#   - Stage-based duplicate checks (same call/band allowed once per 15 min stage)
#     are not enforced in this definition file.
#   - Multiplier U (unique callsign count) is not directly supported as a dedicated
#     multiplier type in current local contest parser/stats.
#   - Official final scoring should be treated as authoritative on ttc platform.

NAME=TTC-SPCWC
CABRILLO_NAME=TTC-SPCWC
MODE=CW
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=LOW
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=NONE
FIELD=SERIAL,Serial Number,required
