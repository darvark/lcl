# ARRL 10-Meter Contest
# Source: https://dxlog.net/sw/files/download/contest/ARRL_10.txt
#
# Extended adaptation note:
# - DXLog uses two multiplier families per mode:
#   1) State/Province (CUSTOM, PER_MODE)
#   2) DXCC (PER_MODE, with exceptions)
# - This logger supports one multiplier strategy at a time, so we keep DXCC.
# - Official mode-dependent points are simplified to baseline POINTS_PER_QSO.
# - Exchange variants (state/province vs serial) are flattened to one field.

NAME=ARRL-10M
CABRILLO_NAME=ARRL-10
MODE=MIXED
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=10M
CATEGORY_POWER=LOW
CATEGORY_OVERLAY=
STATION_LOCATION=DX
OPERATORS=
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC
BONUS_POINTS=0
DOUBLE_QSO=1
FIELD=EXCHANGE,Rcv Exc,required
