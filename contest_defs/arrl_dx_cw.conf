# ARRL DX Contest - CW
# Source: https://dxlog.net/sw/files/download/contest/ARRL_DX.txt
# Cabrillo: ARRL-DX-CW
#
# Scoring:
#   K/VE working DX   : 3 pts
#   DX working K/VE   : 3 pts
#   Same DXCC         : 0 pts (K-K, VE-VE, DX-DX not valid)
# Exchange sent:
#   K/VE: state or province
#   DX  : transmitter power (e.g. 100)
# Exchange recv:
#   K/VE: power from DX station
#   DX  : state/province from K/VE
# Multipliers:
#   For K/VE: DXCC entities per band (DX side)
#   For DX  : US states + Canadian provinces per band
#   Note: state/province multiplier not implemented; DXCC_PER_BAND used

NAME=ARRL-DX-CW
CABRILLO_NAME=ARRL-DX-CW
MODE=CW
CATEGORY_OPERATOR=SINGLE-OP
CATEGORY_BAND=ALL
CATEGORY_POWER=HIGH
EXCHANGE_SENT=#
POINTS_PER_QSO=1
MULTIPLIER=DXCC_PER_BAND
FIELD=SERIAL,Rcv Exch,required
